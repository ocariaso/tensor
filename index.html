<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TENSOR</title>
    <meta name="description" content="TENSOR: Transformative Extrusion of N-Dimensional Spatial Observable Realities" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2305060d'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23fff0d6'/%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%238b7bff' stroke-width='2'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="console">
      <header id="topbar">
        <span class="brand">TENSOR</span>
        <span class="subtitle">Observation Console</span>
        <span id="keys">
          <kbd>0</kbd>–<kbd>4</kbd> dimension &nbsp; <kbd>V</kbd> view &nbsp; <kbd>I</kbd> info &nbsp; <kbd>Space</kbd> play / pause
          &nbsp; <kbd>←</kbd><kbd>→</kbd> step
        </span>
      </header>

      <section id="feed-moment" class="feed" aria-label="Moment feed">
        <div class="feed-title">MOMENT FEED <span>one instant</span></div>
        <div id="moment-badge" class="badge">LIVE</div>
        <div id="branch-picker" class="picker" role="group" aria-label="Branch to follow">
          <span class="picker-label">following</span>
          <div id="branch-buttons"></div>
          <span id="branch-hint"></span>
        </div>
      </section>

      <section id="feed-structure" class="feed" aria-label="Structure feed">
        <div class="feed-title">STRUCTURE FEED <span>the whole dimension at once</span></div>
        <div id="focus-bar" class="picker top" role="group" aria-label="Branch focus">
          <span class="picker-label">focus</span>
          <div id="focus-buttons"></div>
          <span class="picker-label">others</span>
          <div id="others-buttons"></div>
        </div>
        <aside id="info" aria-live="polite">
          <button id="info-toggle" type="button" aria-controls="info-details" aria-expanded="true" title="Minimize (I)">
            <span aria-hidden="true">−</span>
            <span class="visually-hidden">Minimize info panel</span>
          </button>
          <div id="info-tag"></div>
          <h1 id="info-title"></h1>
          <div id="info-details">
            <p id="info-body"></p>
            <ul id="info-legend"></ul>
            <p id="info-view"></p>
          </div>
        </aside>
      </section>

      <aside id="controls" aria-label="Controls"></aside>

      <footer id="timeline" aria-label="Timeline">
        <button id="tl-play" type="button" title="Play / pause (Space)">❚❚</button>
        <div id="tl-rates" role="group" aria-label="Playback speed"></div>
        <div id="tl-track">
          <span class="tl-edge">past</span>
          <div class="tl-rail">
            <input id="tl-scrub" type="range" step="0.01" aria-label="Playhead" />
            <span id="tl-now" aria-hidden="true">now</span>
          </div>
          <span id="tl-future" class="tl-edge">future · estimate</span>
        </div>
        <button id="tl-live" type="button" title="Jump to the present">LIVE</button>
        <span id="tl-readout"></span>
      </footer>

      <footer id="inspector" aria-label="Inspector">
        <span><b>moment</b> <span id="insp-time"></span></span>
        <span id="insp-branch-wrap"><b>branch</b> <span id="insp-branch"></span></span>
        <span><b>position</b> <span id="insp-pos"></span></span>
        <span><b>speed</b> <span id="insp-speed"></span></span>
        <span><b>own clock</b> <span id="insp-clock"></span></span>
        <span><b>confidence</b> <span id="insp-confidence"></span></span>
        <span><b>hidden habit</b> <span id="insp-habit"></span></span>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
